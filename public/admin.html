<!doctype html>
<html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X1 Broadcast · Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="brand"><span class="logo">X1</span><div><b>X1 ADMIN</b><small>Espas administratè prive</small></div></div><a class="admin-link" href="/">Paj enskripsyon</a></header><main class="wrap admin-wrap">
<section class="panel" id="loginBox"><h1>Administratè</h1><p>Konekte pou jere enskripsyon yo.</p><form id="login"><label>Non itilizatè<input name="username" required autocomplete="username"></label><label>Modpas<input name="password" type="password" required autocomplete="current-password"></label><button>KONEKTE</button><p id="loginMsg" role="status"></p></form></section>
<section id="dashboard" hidden><div class="dash-head"><div><span class="eyebrow">DASHBOARD</span><h1>Bonjou, Admin</h1></div><button class="secondary" id="logout">Dekonekte</button></div>
<div class="stats"><article><small>Total manm</small><strong id="total">0</strong></article><article><small>Enskripsyon jodi a</small><strong id="today">0</strong></article><article><small>Enskripsyon mwa sa</small><strong id="month">0</strong></article></div>
<section class="panel"><div class="panel-title"><div><h2>Kontak enskri yo</h2><p>Non kontak yo ap kòmanse ak X1 nan fichye VCF la.</p></div><a class="button" href="/api/admin/export.vcf">TELECHAJE VCF</a></div><input id="search" placeholder="Chèche non oswa nimewo..."><div class="table-wrap"><table><thead><tr><th>Non</th><th>Telefòn</th><th>Dat</th><th></th></tr></thead><tbody id="members"></tbody></table></div><p id="empty"></p></section>
<section class="panel"><h2>Enskripsyon pa jou</h2><div id="daily" class="daily"></div></section></section></main><script src="/admin.js"></script></body></html>
